services:

  opencode:
    container_name: opencode
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    working_dir: /workspace
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    env_file:
      - .env
    ports:
      - "4096:4096"
      - "49374:49374"
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      - cloudflared
    environment:
      # Authentication (Critical: OpenCode has shell access, enforce strong credentials)
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-password}
      # Model Provider API Keys (supply your desired providers in .env)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - GIT_SSH_COMMAND=ssh -i /ssh/id_rsa -o StrictHostKeyChecking=no
      - HOME=/home/user # ensure a writable home dir
      # Evren LLM Bağlantı Parametreleri
      - OPENCODE_PROVIDER=custom
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
    volumes:
      - ${GITHUB_SSH_KEY}:/ssh/id_rsa:ro # SSH key
      - ./home_user:/home/user
      - ./workspace:/workspace # Mount your host project files to the agent workspace
    networks:
      - opencode-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
    restart: unless-stopped
    # The tunnel token should be stored in the .env file
    networks:
      - opencode-net
networks:
  opencode-net:
    driver: bridge
