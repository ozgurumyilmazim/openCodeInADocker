version: '3.8'

services:
  opencode:
    image: ghcr.io/opencode/opencode:latest
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - cloudflared
    # Add any additional configuration or volumes as needed

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run --no-autoupdate
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
    restart: unless-stopped
    # The tunnel token should be stored in the .env file

