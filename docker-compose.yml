services:
  opencode:
    image: ghcr.io/anomalyco/opencode:2.0.0
    working_dir: /app
    user: "${USER_ID}:${GROUP_ID}"
    env_file:
      - .env
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      - cloudflared
    environment:
      - GIT_SSH_COMMAND=ssh -i /ssh/id_rsa -o StrictHostKeyChecking=no
      - HOME=/home/user # ensure a writable home dir
      - XDG_DATA_HOME=/home/user/.local # OpenCode writes here
    volumes:
      - ./workspace:/app # repo workspace
      - ${GITHUB_SSH_KEY}:/ssh/id_rsa:ro # SSH key
      - ./opencode_data:/home/user/.local # <-- new volume for .local

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
    restart: unless-stopped
    # The tunnel token should be stored in the .env file
