services:
  opencode:
    container_name: opencode
    image: ghcr.io/anomalyco/opencode:latest
    working_dir: /workspace
    user: "${USER_ID}:${GROUP_ID}"
    #command: [ "opencode", "web", "--hostname", "0.0.0.0", "--port", "4096" ]
    env_file:
      - .env
    ports:
      - "4096:4096"
    restart: unless-stopped
    depends_on:
      - cloudflared
    environment:
      # Authentication (Critical: OpenCode has shell access, enforce strong credentials)
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-password}
      # Model Provider API Keys (supply your desired providers in .env)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - GIT_SSH_COMMAND=ssh -i /ssh/id_rsa -o StrictHostKeyChecking=no
      - HOME=/home/user # ensure a writable home dir
    volumes:
      - ${GITHUB_SSH_KEY}:/ssh/id_rsa:ro # SSH key
      - ./home_user:/home/user
      - ./workspace:/workspace # Mount your host project files to the agent workspace

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
    restart: unless-stopped
    # The tunnel token should be stored in the .env file
